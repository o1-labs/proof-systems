[package]
name = "kimchi-stubs"
authors = ["opensource@o1labs.org"]
description = "OCaml stubs for the plonk proof systems"
edition.workspace = true
license = "MIT/Apache-2.0"
repository = "https://github.com/MinaProtocol/mina"
version.workspace = true

[lib]
name = "kimchi_stubs"
# staticlib is linked statically into native binaries; cdylib becomes
# dllkimchi_stubs.so, dlopened only by OCaml bytecode / utop builds. The cdylib
# references undefined caml_* runtime symbols resolved at load time from the
# host executable; on macOS the link needs -undefined dynamic_lookup, which the
# Mina-side dune rule threads through RUSTFLAGS.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
libc.workspace = true
num-bigint = { workspace = true, features = ["rand", "serde"] }
# ocaml-specific
ocaml = { workspace = true, features = ["no-caml-startup"] }
ocaml-gen.workspace = true
paste.workspace = true
rand.workspace = true
rayon.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true

# arkworks
ark-ec = { workspace = true, features = ["parallel"] }
ark-ff = { workspace = true, features = ["parallel", "asm"] }
ark-poly = { workspace = true, features = ["parallel"] }
ark-serialize.workspace = true

# proof-systems
groupmap = { workspace = true, features = ["parallel"] }
kimchi = { workspace = true, features = ["ocaml_types"] }
mina-curves = { workspace = true, features = ["parallel"] }
mina-poseidon = { workspace = true, features = ["parallel"] }
o1-utils = { workspace = true }
poly-commitment = { workspace = true, features = ["ocaml_types"] }
