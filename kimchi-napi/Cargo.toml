[package]
name = "kimchi-napi"
version.workspace = true
authors = ["opensource@o1labs.org"]
description = "Node-API bindings for kimchi proof systems"
repository = "https://github.com/MinaProtocol/mina"
license = "MIT/Apache-2.0"
edition = "2021"

[lib]
name = "kimchi_napi"
crate-type = ["cdylib"] # to generate a dynamic library that is loadable by Node

[dependencies]
napi = { workspace = true, features = ["napi7"] }
napi-derive.workspace = true

# arkworks — the `parallel` features matter: without them MSM/FFT inside
# arkworks run sequentially and proving is several times slower (the old
# kimchi-wasm crate enabled them too)
ark-ec = { workspace = true, features = ["parallel"] }
ark-ff = { workspace = true, features = ["parallel", "asm"] }
ark-poly = { workspace = true, features = ["parallel"] }
ark-serialize.workspace = true
arkworks.workspace = true

# proof-systems
groupmap = { path = "../groupmap", features = ["parallel"] }
mina-curves = { path = "../curves", features = ["parallel"] }
mina-poseidon = { path = "../poseidon" }
o1-utils = { path = "../utils" }
poly-commitment = { path = "../poly-commitment" }

base64.workspace = true
getrandom.workspace = true
kimchi.workspace = true
libc.workspace = true
num-bigint.workspace = true
once_cell.workspace = true
paste.workspace = true
rand.workspace = true
rayon.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
wasm-types.workspace = true

[build-dependencies]
napi-build.workspace = true
