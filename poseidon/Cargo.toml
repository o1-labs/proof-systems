[package]
name = "mina-poseidon"
description = "An instantiation of the Poseidon hash function for the pasta fields"
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ark-ec.workspace = true
ark-ff.workspace = true
ark-poly.workspace = true
ark-serialize.workspace = true
mina-curves = { workspace = true, default-features = false }
o1-utils.workspace = true
ocaml = { workspace = true, optional = true }
ocaml-gen = { workspace = true, optional = true }
rand.workspace = true
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_with.workspace = true
# Same source and tag as mina-curves: one version of the guest crates in the
# graph, or the moduli declarations do not line up.
# Zero-copy [u64; 4] <-> [u8; 32] reinterpretation on the chip boundary.
# Pod-to-Pod casts, so no `unsafe` is introduced.
bytemuck = { version = "1", default-features = false, optional = true }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview", optional = true }

[dev-dependencies]
criterion.workspace = true
hex.workspace = true
serde_json.workspace = true

[features]
default = ["std", "parallel"]
std = []
parallel = [
  "std",
  "rayon",
  "ark-ec/parallel",
  "ark-ff/parallel",
  "ark-poly/parallel",
  "mina-curves/parallel",
]
ocaml_types = ["ocaml", "ocaml-gen"]
# Runs the Poseidon permutation on OpenVM's modular chip for the Pasta fields
# when compiled for a zkVM target. Off-target it is inert: the gate keys on
# `target_os` too, matching mina-curves.
openvm = ["mina-curves/openvm", "dep:openvm-algebra-guest", "dep:bytemuck"]

[[bench]]
name = "poseidon_bench"
harness = false

[[bench]]
name = "poseidon"
harness = false
